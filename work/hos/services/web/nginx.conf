map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # Docker embedded DNS (prevents stale upstream IPs after container restart)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Static SPA
  root /usr/share/nginx/html;
  index index.html;

  # Messaging API proxy (same-origin, no CORS needed)
  # Example: GET /api/messaging/api/v1/threads/:id -> upstream GET /api/v1/threads/:id
  location ^~ /api/messaging/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    set $messaging_upstream http://messaging-api:3000;
    # strip /api/messaging prefix, forward remainder as-is
    rewrite ^/api/messaging/(.*)$ /$1 break;
    proxy_pass $messaging_upstream;
  }

  # Marketplace API proxy (same-origin, no CORS needed) - WP-61
  # Example: GET /api/marketplace/api/v1/listings -> upstream GET /api/v1/listings
  location ^~ /api/marketplace/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $pazar_upstream http://pazar-app:80;
    # strip /api/marketplace prefix, forward remainder as-is
    rewrite ^/api/marketplace/(.*)$ /$1 break;
    proxy_pass $pazar_upstream;
  }

  # Browser talks to same-origin nginx; nginx proxies /api/* to the H-OS API service.
  # Example: GET /api/v1/health -> upstream GET /v1/health
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $hos_upstream http://hos-api:3000;
    # strip /api prefix
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $hos_upstream;
  }

  # Marketplace SPA (served under /marketplace/)
  location /marketplace/ {
    alias /usr/share/nginx/html/marketplace/;
    try_files $uri $uri/ /marketplace/index.html;
  }

  # HOS Web SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}

