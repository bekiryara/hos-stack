# Template for generating an Alertmanager Slack config by replacing __PLACEHOLDER__ tokens.
# NOTE: Legacy bootstrap tooling was removed; generate a derived config via your ops workflow if needed.
route:
  receiver: "slack"
  group_by: ["alertname", "job", "instance"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "slack"
    slack_configs:
      - api_url: "__SLACK_WEBHOOK_URL__"
        channel: "__SLACK_CHANNEL__"
        username: "__SLACK_USERNAME__"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts -}}
          *{{ .Labels.severity }}* — {{ .Annotations.summary }}\n{{ .Annotations.description }}\n
          {{ end }}


