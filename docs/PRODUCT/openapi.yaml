openapi: 3.1.0
info:
  title: Pazar Marketplace API (Canonical)
  version: 1.4.0
  description: >
    Canonical OpenAPI contract for the Pazar service (world: marketplace).
    This spec intentionally does NOT describe any retired multiworld routing such as /api/v1/{world}/...

servers:
  - url: http://localhost:8080

tags:
  - name: World
    description: World status / service identity
  - name: Catalog
    description: Categories and filter schema (guest)
  - name: Listings
    description: Marketplace listings (read + write spine)

paths:
  /api/world/status:
    get:
      tags: [World]
      summary: World status for Pazar (marketplace)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldStatus"
        default:
          $ref: "#/components/responses/ErrorEnvelope"

  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Get category tree
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryNode"
        default:
          $ref: "#/components/responses/ErrorEnvelope"

  /api/v1/categories/{id}/filter-schema:
    get:
      tags: [Catalog]
      summary: Get filter schema for a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryFilterSchema"
        "404":
          $ref: "#/components/responses/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorEnvelope"

  /api/v1/listings:
    get:
      tags: [Listings]
      summary: Search listings (guest)
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        default:
          $ref: "#/components/responses/ErrorEnvelope"
    post:
      tags: [Listings]
      summary: Create listing (draft by default)
      description: >
        Requires store persona and X-Active-Tenant-Id. In GENESIS mode, Authorization may be optional
        depending on environment policy.
      parameters:
        - $ref: "#/components/parameters/XActiveTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorEnvelope"

  /api/v1/listings/{id}:
    get:
      tags: [Listings]
      summary: Get listing detail (guest)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          $ref: "#/components/responses/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorEnvelope"

  /api/v1/listings/{id}/publish:
    post:
      tags: [Listings]
      summary: Publish a draft listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/XActiveTenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorEnvelope"

components:
  parameters:
    XActiveTenantId:
      name: X-Active-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Active tenant id (required for store/write persona).

  responses:
    ErrorEnvelope:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [request_id, error]
      properties:
        request_id:
          type: string
          description: Correlation id for tracing/debugging.
        error:
          $ref: "#/components/schemas/ErrorObject"
        details:
          type: object
          additionalProperties: true

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    WorldStatus:
      type: object
      required: [world_key, availability, phase, version]
      properties:
        world_key:
          type: string
          example: marketplace
        availability:
          type: string
          example: ONLINE
        phase:
          type: string
          example: GENESIS
        version:
          type: string

    CategoryNode:
      type: object
      required: [id, parent_id, slug, title, status, children]
      properties:
        id:
          type: integer
        parent_id:
          anyOf:
            - type: integer
            - type: "null"
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          example: active
        children:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/CategoryNode"
            - type: string
              description: Legacy empty string from seed data (kept for compatibility).

    CategoryFilterSchema:
      type: object
      required: [category_id, category_slug, filters]
      properties:
        category_id:
          type: integer
        category_slug:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/FilterSchemaItem"

    FilterSchemaItem:
      type: object
      required: [attribute_key, key, label, value_type, status, sort_order, ui_component, required, filter_mode, type]
      properties:
        attribute_key:
          type: string
        key:
          type: string
        label:
          type: string
        value_type:
          type: string
        unit:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
        sort_order:
          type: integer
        ui_component:
          type: string
        ui_type:
          type: string
          nullable: true
        required:
          type: boolean
        filter_mode:
          type: string
        rules:
          type: object
          additionalProperties: true
        type:
          type: string

    ListingCreateRequest:
      type: object
      required: [title, category_id]
      properties:
        title:
          type: string
          maxLength: 255
        category_id:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true
        price_amount:
          type: integer
          minimum: 0
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        attributes:
          type: object
          additionalProperties: true

    Listing:
      type: object
      required: [id, world, status, title, category_id, attributes]
      properties:
        id:
          type: string
        world:
          type: string
          example: marketplace
        status:
          type: string
          enum: [draft, published]
        title:
          type: string
        category_id:
          type: integer
        description:
          type: string
          nullable: true
        price_amount:
          type: integer
          nullable: true
        currency:
          type: string
          nullable: true
        attributes:
          type: object
          additionalProperties: true
