name: RC0 Release Readiness Gate

on:
  workflow_dispatch:

jobs:
  rc0-check:
    runs-on: ubuntu-latest
    env:
      TENANT_TEST_EMAIL: ${{ secrets.TENANT_TEST_EMAIL }}
      TENANT_TEST_PASSWORD: ${{ secrets.TENANT_TEST_PASSWORD }}
      TENANT_A_SLUG: ${{ secrets.TENANT_A_SLUG }}
      TENANT_B_SLUG: ${{ secrets.TENANT_B_SLUG }}
      PRODUCT_TEST_TENANT_ID: ${{ secrets.PRODUCT_TEST_TENANT_ID }}
      PRODUCT_TEST_AUTH_TOKEN: ${{ secrets.PRODUCT_TEST_AUTH_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CI preflight (secrets + external volume)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_preflight.ps1
      
      - name: Bring up core stack
        run: |
          docker compose up -d --build
          # Wait for services to be ready
          timeout 120 bash -c 'until curl -f http://localhost:8080/up && curl -f http://localhost:3000/v1/health; do sleep 5; done' || true

      - name: Seed public tenant (for Google-first checks)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_seed_public_tenant.ps1 -Quiet
      
      - name: Run RC0 Check Gate
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./ops/ops.ps1 rc0 -Ci
          if ($LASTEXITCODE -eq 1) { exit 1 } else { exit 0 }
        continue-on-error: false
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc0-check-logs
          path: |
            _archive/audits/*
            _archive/incidents/*
          retention-days: 7
      
      - name: Generate incident bundle on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path ./ops/_checks/incident_bundle.ps1) {
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./ops/_checks/incident_bundle.ps1
          }
        continue-on-error: true
      
      - name: Upload incident bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc0-check-incident-bundle
          path: |
            _archive/incidents/*
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down























