name: Ops Status Dashboard

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

jobs:
  ops_status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI preflight (secrets + external volume)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_preflight.ps1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          echo "Starting docker compose services..."
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Seed public tenant (for Google-first checks)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_seed_public_tenant.ps1 -Quiet

      - name: Run ops drift guard
        shell: pwsh
        run: |
          pwsh ./ops/_checks/ops_drift_guard.ps1 -Ci

      - name: Run ops status dashboard
        shell: pwsh
        run: |
          pwsh ./ops/ops.ps1 status -Ci

      - name: Upload incident bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incident-bundle
          path: |
            _archive/incidents/
            incident_bundles/
          if-no-files-found: ignore
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up services..."
          docker compose down -v

      - name: Ops Status Summary
        if: failure()
        run: |
          echo "❌ Ops status dashboard failed"
          echo ""
          echo "One or more operational checks failed."
          echo "Review the output above or check the incident bundle artifact."
          echo ""
          echo "Checks performed:"
          echo "  - Repository Doctor"
          echo "  - Stack Verification"
          echo "  - Incident Triage"
          echo "  - SLO Check"
          echo "  - Security Audit"
          echo "  - Conformance"
          echo "  - Routes Snapshot"
          echo "  - Schema Snapshot"
          echo "  - Error Contract"

