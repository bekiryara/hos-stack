name: Pazar UI Smoke Gate

on:
  workflow_dispatch:

jobs:
  pazar-ui-smoke:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CI preflight (secrets + external volume)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_preflight.ps1
      
      - name: Bring up core stack
        run: |
          docker compose up -d --build
          # Wait for services to be ready
          timeout 120 bash -c 'until curl -f http://localhost:8080/up && curl -f http://localhost:3000/v1/health; do sleep 5; done' || true

      - name: Seed public tenant (for Google-first checks)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_seed_public_tenant.ps1 -Quiet
      
      - name: Run Pazar UI Smoke Gate
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./ops/_checks/pazar_ui_smoke.ps1
        continue-on-error: false
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pazar-ui-smoke-logs
          path: |
            _archive/audits/*
            _archive/incidents/*
          retention-days: 7
      
      - name: Upload docker compose logs on failure
        if: failure()
        run: |
          docker compose logs > docker-compose-logs.txt 2>&1 || true
        continue-on-error: true
      
      - name: Upload docker compose logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pazar-ui-smoke-docker-logs
          path: docker-compose-logs.txt
          retention-days: 7
      
      - name: Generate incident bundle on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path ./ops/_checks/incident_bundle.ps1) {
            pwsh -NoProfile -ExecutionPolicy Bypass -File ./ops/_checks/incident_bundle.ps1
          }
        continue-on-error: true
      
      - name: Upload incident bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pazar-ui-smoke-incident-bundle
          path: |
            _archive/incidents/*
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down






















