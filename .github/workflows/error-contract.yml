name: Error Contract Gate

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

jobs:
  error_contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI preflight (secrets + external volume)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_preflight.ps1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          echo "Starting docker compose services..."
          docker compose up -d --build
          echo "Waiting for services to be ready..."
          sleep 15

      - name: Seed public tenant (for Google-first checks)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_seed_public_tenant.ps1 -Quiet

      - name: Error contract check (SSOT helper)
        shell: pwsh
        run: |
          Write-Host "=== Error Contract Gate (SSOT helper) ==="
          . ./ops/_lib/error_contract.ps1
          $res = Invoke-ErrorContractCheck -BaseUrl "http://localhost:8080"
          Write-Host ("Status={0} ExitCode={1} Notes={2}" -f $res.Status, $res.ExitCode, $res.Notes)
          if ([int]$res.ExitCode -ne 0) { exit ([int]$res.ExitCode) }
          exit 0

      - name: Error Contract Summary
        if: success()
        run: |
          echo "✅ Error contract validation passed"
          echo ""
          echo "All error responses use standard envelope:"
          echo "  - 422: { ok:false, error_code:'VALIDATION_ERROR', request_id, details:{fields} }"
          echo "  - 404: { ok:false, error_code:'NOT_FOUND', request_id }"

      - name: Error Contract Summary (on failure)
        if: failure()
        run: |
          echo "❌ Error contract validation failed"
          echo ""
          echo "Error responses must use standard envelope:"
          echo "  - ok: false"
          echo "  - error_code: VALIDATION_ERROR | NOT_FOUND | etc."
          echo "  - request_id: (required)"
          echo "  - details: (optional, for validation errors)"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker compose down -v

