name: OpenAPI Contract Check

on:
  workflow_dispatch:

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run OpenAPI Contract Check
        shell: pwsh
        run: |
          pwsh ./ops/_checks/openapi_contract.ps1
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-logs
          path: |
            _archive/audits/*
            _archive/incidents/*
          retention-days: 7





