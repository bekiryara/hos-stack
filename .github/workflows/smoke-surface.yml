name: Smoke Surface Gate

on:
  workflow_dispatch:

jobs:
  smoke-surface:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CI preflight (secrets + external volume)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_preflight.ps1
      
      - name: Bring up core stack
        run: |
          docker compose up -d --build
          # Wait for services to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8080/up; do sleep 2; done' || true

      - name: Seed public tenant (for Google-first checks)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_seed_public_tenant.ps1 -Quiet
      
      - name: Run Smoke Surface Gate
        shell: pwsh
        run: |
          pwsh ./ops/_checks/smoke_surface.ps1
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-surface-logs
          path: |
            _archive/audits/*
            _archive/incidents/*
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v



