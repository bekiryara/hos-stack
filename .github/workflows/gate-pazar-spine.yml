name: Gate Pazar Spine

on:
  workflow_dispatch:

jobs:
  gate-pazar-spine:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check SPEC.md exists
        run: |
          if [ ! -f "docs/SPEC.md" ]; then
            echo "ERROR: docs/SPEC.md is missing. SPEC is required as single source of truth."
            exit 1
          fi
          echo "PASS: docs/SPEC.md exists"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: CI preflight (secrets + external volume)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_preflight.ps1
      
      - name: Start services
        run: |
          # CI uses a tiny in-repo manifests set to keep the repo clean
          # while still exercising the importer + contracts.
          export CATALOG_MANIFESTS_HOST_PATH=./work/pazar/catalog/manifests_ci
          docker compose up -d --build
          sleep 10

      - name: Seed public tenant (for Google-first checks)
        shell: pwsh
        run: |
          pwsh ./ops/_tools/ci_seed_public_tenant.ps1 -Quiet
      
      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/up && curl -f http://localhost:3000/v1/health; do sleep 2; done'
      
      - name: Run migrations
        run: |
          docker compose exec -T pazar-app php artisan migrate:fresh --force
      
      - name: Import catalog manifests (canonical)
        run: |
          # NOTE (V2): canonical catalog data lives outside this repo (external dataset).
          # In CI we may not have access to that dataset, so this step becomes conditional:
          # - If manifests are mounted/present, we run import (fail-fast).
          # - If not present, we SKIP with a clear message (CI remains green).
          if docker compose exec -T pazar-app bash -lc 'test -f /var/www/html/catalog/manifests/manifest.meta.json'; then
            docker compose exec -T pazar-app php artisan catalog:import --dry-run
            docker compose exec -T pazar-app php artisan catalog:import --apply
          else
            echo "SKIP: catalog manifests not found at /var/www/html/catalog/manifests (external dataset not mounted in CI)."
          fi
        continue-on-error: false
      
      - name: Run V2 Gate (0-targets)
        run: |
          pwsh -File ./ops/_checks/v2_gate.ps1
        continue-on-error: false
      
      - name: Run Pazar Spine Check
        run: |
          pwsh -File ./ops/_checks/pazar_spine_check.ps1
        continue-on-error: false

